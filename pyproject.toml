[project]
name = "ibis"
version = "0.1.0"
description = "IBIS (Information Budget Insight System) is a web-based portal that aggregates and consolidates data from various institutional source systems and prepares it for reporting."
requires-python = ">=3.14"
dependencies = [
    "django>=6.1,<6.2",
]

[dependency-groups]
dev = [
    "commitizen>=4.19.0",
    "djlint>=1.36.4",
    "pre-commit>=4.3.0",
    "pyrefly>=1.0.0",
    "ruff>=0.15.7",
    "zensical>=0.0.70",
]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["config"]
extend-exclude = ["migrations"]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

[tool.djlint]
# H031: <meta name="keywords"> is deprecated and ignored by search engines.
ignore = ["H031"]
