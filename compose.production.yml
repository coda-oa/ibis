name: ibis-production

services:
  django:
    build:
      context: .
      dockerfile: ./dockerfiles/production/Dockerfile

    image: ibis_production_django
    container_name: ibis_production_django

    env_file:
      - ./.envs/production/django.env
      - ./.envs/production/postgres.env

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "8011:8000"

  postgres:
    image: postgres:${POSTGRES_VERSION}
    container_name: ibis_production_postgres

    env_file:
      - ./.envs/production/postgres.env

    volumes:
      - ibis_production_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ibis_production_postgres_data:
